<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aToolskit</title>
    <link rel="icon" type="image/x-icon" href="assets/images/file_00000000061c81fa8abc2dc96c64f0f9.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="hero">
            <h1>✦ aToolskit ✦</h1>
            <p class="subtitle">Selamat datang di aToolskit</p>
            <div class="button-group">
                <a href="apikey/" class="btn btn-primary">🔑 API Key Manager</a>
            </div>
        </div>
        <footer>
            <p>&copy; 2026 aToolskit</p>
        </footer>
    </div>

    <!-- ===== EFEK SALJU TURUN ===== -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const canvas = document.createElement('canvas');
            canvas.id = 'snow-canvas';
            canvas.style.position = 'fixed';
            canvas.style.top = '0';
            canvas.style.left = '0';
            canvas.style.width = '100vw';
            canvas.style.height = '100vh';
            canvas.style.pointerEvents = 'none';
            canvas.style.zIndex = '9999';
            document.body.appendChild(canvas);

            const ctx = canvas.getContext('2d');
            let width, height;
            let snowflakes = [];

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Snowflake {
                constructor() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.size = Math.random() * 4 + 2;
                    this.speed = Math.random() * 1.5 + 0.5;
                    this.wind = Math.random() * 0.5 - 0.25;
                    this.opacity = Math.random() * 0.5 + 0.5;
                    this.rotation = Math.random() * 360;
                    this.rotSpeed = Math.random() * 0.02 - 0.01;
                }
                update() {
                    this.y += this.speed;
                    this.x += this.wind;
                    this.rotation += this.rotSpeed;
                    if (this.y > height) {
                        this.y = -10;
                        this.x = Math.random() * width;
                    }
                    if (this.x > width) this.x = -10;
                    if (this.x < -10) this.x = width;
                }
                draw(ctx) {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation * Math.PI / 180);
                    ctx.globalAlpha = this.opacity;
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            for (let i = 0; i < 100; i++) {
                snowflakes.push(new Snowflake());
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);
                snowflakes.forEach(s => {
                    s.update();
                    s.draw(ctx);
                });
                requestAnimationFrame(animate);
            }
            animate();
        });
    </script>
</body>
</html>
